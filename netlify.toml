[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) redirect rule for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
